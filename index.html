<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevPreview Demo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="icon">
                🚀
            </div>

            <h1>DevPreview Demo</h1>

            <p class="subtitle">
                GitHub → Jenkins → Docker → Ansible
            </p>

            <div class="status">
                <span class="status-dot"></span>
                Application Running
            </div>

            <p class="message">
                This application was successfully deployed
                through our automated DevOps pipeline.
            </p>

            <div class="pipeline">

                <div class="step">
                    <span>1</span>
                    <p>GitHub</p>
                </div>

                <div class="arrow">→</div>

                <div class="step">
                    <span>2</span>
                    <p>Jenkins</p>
                </div>

                <div class="arrow">→</div>

                <div class="step">
                    <span>3</span>
                    <p>Docker</p>
                </div>

                <div class="arrow">→</div>

                <div class="step">
                    <span>4</span>
                    <p>Ansible</p>
                </div>

            </div>

            <button id="testButton">
                Test Application
            </button>

            <p id="result"></p>

        </div>

    </main>

    <script src="app.js"></script>

</body>

</html>
